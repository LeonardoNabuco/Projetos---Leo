<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projetos de Implantação Klingo</title>
<style>
:root{--bg:#f5f7f8;--card:#fff;--ink:#1d2a33;--mut:#66757f;--line:#dfe5e9;--acc:#0f7c74;--acc2:#e3f3f1;--warn:#b45309;--warnbg:#fef3e2;--dec:#5b4bc4;--decbg:#eeebfb;--blue:#2b5a7a;--bluebg:#eef4f8;--red:#b91c1c}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:16px;margin:0 10px 0 0;color:var(--acc)}
.st{margin-left:auto;font-size:12px;color:var(--mut);white-space:nowrap}
.st.err{color:var(--red)}
select,input,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;max-width:100%}
textarea{width:100%;resize:vertical;min-height:70px}
input[type=text],input[type=password],input[type=date]{width:100%}
button,.btn{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;color:inherit;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:var(--acc)}
button:disabled{opacity:.5;cursor:default}
.pri{background:var(--acc)!important;color:#fff!important;border-color:var(--acc)!important}
.danger{color:var(--red)}
.sm{padding:3px 8px!important;font-size:12px}
nav#tabs{display:flex;gap:2px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto}
nav#tabs button{border:none;border-bottom:3px solid transparent;border-radius:0;padding:11px 12px;color:var(--mut);font-weight:500;white-space:nowrap}
nav#tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.badge{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:1px 7px;font-size:11px}
main{padding:18px 20px;max-width:1400px;margin:0 auto}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.panel h2{margin:0 0 4px;font-size:18px}
.panel h3{margin:0 0 6px;font-size:15px}
.hint{color:var(--mut);font-size:12px;margin-top:6px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:14px}
.form label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px;font-weight:600}
.form .full{grid-column:1/-1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.kpi:hover{border-color:var(--acc)}
.kpi .n{font-size:24px;font-weight:700}
.kpi .l{font-size:12px;color:var(--mut)}
.next{background:var(--acc2);border-radius:12px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
/* mapa */
.hero{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin-bottom:16px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.hero h2{margin:0;font-size:21px}
.hero .sub{color:var(--mut);font-size:13px;margin-top:3px}
.hero .cd{text-align:right}
.fatual{margin-left:auto;background:var(--acc2);border-radius:10px;padding:8px 12px}.fatual .l{font-size:11px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}.fatual select{font-weight:600;border-color:var(--acc);color:var(--acc)}
.hero .cd .n{font-size:26px;font-weight:700;color:var(--acc)}
.hero .cd .l{font-size:12px;color:var(--mut)}
.fases{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:0 0 16px}
.fase{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fase.vista{border:2px solid var(--ink);padding:11px 13px}
.fase .fn{font-weight:700;font-size:14px}
.st3{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:20px;padding:3px 10px;align-self:flex-start}
.st3 .dot{width:9px;height:9px;border-radius:50%}
.st3.r{background:#fde8e8;color:#b91c1c}.st3.r .dot{background:#dc2626}
.st3.y{background:#fef6d8;color:#92400e}.st3.y .dot{background:#eab308}
.st3.g{background:#e3f3f1;color:#0f7c74}.st3.g .dot{background:#16a34a}
.pbar{height:7px;background:#eef1f3;border-radius:4px;overflow:hidden}.pbar i{display:block;height:100%}
.pbar.r i{background:#dc2626}.pbar.y i{background:#eab308}.pbar.g i{background:#16a34a}
.fase .cnt{font-size:12px;color:var(--mut)}
.fase button{justify-content:center;margin-top:2px}
@media(max-width:1000px){.fases{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.fases{grid-template-columns:1fr}}
.st3.n{background:#eef1f3;color:#66757f}.st3.n .dot{background:#9aa5ad}.pbar.n i{background:#9aa5ad}
.fase.atual{box-shadow:inset 0 3px 0 var(--acc)}
.fa{font-size:10px;background:var(--acc);color:#fff;border-radius:8px;padding:1px 6px;vertical-align:middle;font-weight:600}
table.tr{width:100%;border-collapse:collapse;min-width:1050px}
table.tr th{text-align:left;font-size:12px;color:var(--mut);padding:7px 6px;border-bottom:2px solid var(--line);background:#fafbfc}
table.tr td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.tr input,table.tr select,table.tr textarea{width:100%;font-size:13px;padding:5px 7px}
table.tr .cod{font-size:12px;color:var(--mut);font-weight:600;padding-top:11px;white-space:nowrap}
table.tr .crit{font-size:11px;color:var(--mut);margin:3px 2px 0}
tr.trg td{background:var(--acc2);font-weight:700;color:var(--acc);font-size:12px;text-transform:uppercase;letter-spacing:.03em}
tr.late td{background:#fffaf0}
tr.na td input[type=text]{text-decoration:line-through;color:var(--mut)}
tr.det td{background:#fafbfc}
.detg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.detg .w2{grid-column:span 2}.detg label{display:block;font-size:11px;color:var(--mut);font-weight:600;margin-bottom:3px}
.ss{font-weight:600}.ss-ar{background:#f1f3f5}.ss-em{background:#fef6d8;color:#92400e}.ss-ok{background:#e3f3f1;color:#0f7c74}.ss-pc{background:#fde8e8;color:#b91c1c}.ss-na{background:#fff;color:#9aa5ad}
.fases{grid-template-columns:repeat(5,1fr)!important}
/* auditoria */
table.au{width:100%;border-collapse:collapse;background:var(--card)}
table.au th{text-align:left;font-size:12px;color:var(--mut);padding:7px;border-bottom:2px solid var(--line);background:#fafbfc}
table.au td{padding:6px 7px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
table.au select,table.au textarea{width:100%;font-size:13px;padding:5px 7px}
table.au textarea{min-height:34px}
.va-SIM{background:#e3f3f1;color:#0f7c74;font-weight:600}.va-PARCIAL{background:#fef6d8;color:#92400e;font-weight:600}.va-NÃO{background:#fde8e8;color:#b91c1c;font-weight:600}.va-NSA{background:#f1f3f5;color:#66757f}
.fatual .fv{font-weight:700;color:var(--acc);font-size:15px}
.mgrid{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:18px}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}.kgrid .kpi{padding:12px 14px}.kgrid .kpi .n{font-size:22px}
.ptitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px}.ptitle h3{margin:0;font-size:16px}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 18px}
.dv .dl{font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.03em}.dv .dd{font-size:14px;font-weight:600;margin-top:2px}.vazio{color:#c3cbd1;font-weight:400}
h3.sect{font-size:15px;margin:6px 2px 10px}
.fase.clk{cursor:pointer;transition:.15s}.fase.clk:hover{border-color:var(--acc);box-shadow:0 3px 10px rgba(0,0,0,.07)}
.subnav{display:flex;gap:6px;margin-bottom:14px}.subnav button{border-radius:20px;font-weight:600}.subnav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.pill{border-radius:20px;font-size:13px;padding:6px 12px}.pill small{color:var(--mut)}.pill.on{border:2px solid var(--ink);font-weight:600;padding:5px 11px}
.dot.d-r{background:#dc2626}.dot.d-y{background:#eab308}.dot.d-g{background:#16a34a}.dot.d-n{background:#9aa5ad}
@media(max-width:1000px){.mgrid{grid-template-columns:1fr}.dgrid{grid-template-columns:1fr 1fr}}
.seg{display:inline-flex;background:#e9edf0;border-radius:10px;padding:3px;margin-bottom:14px}
.seg button{border:none;background:transparent;border-radius:8px;padding:7px 16px;font-weight:600;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stepper{display:grid;grid-template-columns:repeat(9,minmax(0,1fr)) minmax(0,1.1fr);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 8px 12px;margin-bottom:14px;position:relative}
.stepper::before{content:"";position:absolute;left:5%;right:calc(10% + 5%);top:33px;height:3px;background:#e3e8eb;z-index:0}
.step{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:transparent;padding:0 2px;cursor:pointer;min-width:0}
.step:hover .sc{transform:scale(1.08)}
.step .sc{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);transition:.15s}
.step.s-r .sc{background:#dc2626}.step.s-y .sc{background:#eab308}.step.s-g .sc{background:#16a34a}.step.s-n .sc{background:#9aa5ad}
.step.vz{opacity:.45}
.step.on .sc{box-shadow:0 0 0 3px var(--ink);transform:scale(1.12)}
.step .sn{font-size:12px;font-weight:600;color:var(--ink);text-align:center;line-height:1.2;overflow-wrap:anywhere}
.step.on .sn{text-decoration:underline;text-underline-offset:3px}
.step .sp{font-size:11px;color:var(--mut)}
.step .sa{font-size:10px;background:var(--acc);color:#fff;border-radius:8px;padding:0 6px;font-weight:600}
.step.gp{border-left:1px dashed var(--line);margin-left:6px}
@media(max-width:900px){.stepper{grid-template-columns:repeat(5,minmax(0,1fr));row-gap:14px}.stepper::before{display:none}.step.gp{border-left:none;margin-left:0}}
/* segmento de atuação */
.segbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--ac) 8%,#fff);border:1px solid color-mix(in srgb,var(--ac) 30%,#fff);border-left:6px solid var(--ac);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.sgl{display:flex;gap:12px;align-items:center;flex:1 1 260px;min-width:0}
.sgic{width:44px;height:44px;border-radius:12px;background:var(--ac);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.sgk{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);font-weight:700}
.sgv{font-size:20px;font-weight:800;color:var(--ac);line-height:1.15}
.sgm{font-size:12px;color:var(--mut)}
.sgops{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 380px;justify-content:flex-end}
.sgo{font-size:12px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600}
.sgo.on{background:var(--oc);border-color:var(--oc);color:#fff}
@media(max-width:700px){.sgops{justify-content:flex-start}}
.sarea{display:flex;align-items:center;gap:6px;border:2px solid var(--ac);background:color-mix(in srgb,var(--ac) 8%,#fff);border-radius:10px;padding:4px 6px;margin-bottom:6px}
.sarea span{font-size:18px}.sarea select{flex:1;min-width:0;border:none;background:transparent;font-weight:700;color:var(--ac);padding:4px 2px}
/* atividades da trilha */
.fhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}.fhead h3{margin:0;font-size:17px}
.tfil{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tfil button{font-size:12px;padding:5px 11px;border-radius:999px;font-weight:600}.tfil button small{color:var(--mut);font-weight:600;margin-left:2px}
.tfil button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.tfil button.on small{color:#cbd5e1}
.agrp{margin-bottom:14px}.agh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--acc);border-bottom:2px solid var(--acc2);padding:4px 2px;margin-bottom:6px}
.agh small{text-transform:none;letter-spacing:0;font-weight:600;color:var(--mut)}
.ativ{border:1px solid var(--line);border-left:5px solid #cbd5e1;border-radius:10px;background:#fff;margin-bottom:6px}
.ativ.st-em{border-left-color:#eab308}.ativ.st-ok{border-left-color:#16a34a;background:#fbfefc}.ativ.st-pc{border-left-color:#dc2626}.ativ.st-na{border-left-color:#e2e8f0;background:#fafbfc}
.ativ.late{border-color:#fecaca}.ativ.open{box-shadow:0 2px 10px rgba(0,0,0,.07)}
.arow{display:flex;gap:12px;align-items:center;padding:9px 12px;flex-wrap:wrap}
.atit{flex:1 1 300px;min-width:0}
.att{font-weight:600;font-size:14px;line-height:1.3;overflow-wrap:anywhere}.ativ.st-ok .att{color:#64748b}.ativ.st-na .att{color:#94a3b8;text-decoration:line-through}
.acod{display:inline-block;font-size:11px;font-weight:700;color:var(--mut);background:#f1f5f9;border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.ameta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;font-size:11px;color:var(--mut)}.ameta .atag{margin:0}
.acrit{overflow-wrap:anywhere}.alate{color:#b91c1c;font-weight:700}.anote{color:#0369a1}
.actl{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;flex:0 1 auto}
.fl{display:flex;flex-direction:column;gap:2px;margin:0}.fl>span{font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.fl select,.fl input{font-size:13px;padding:6px 8px}
.fl select.ss{width:170px;font-weight:700}.fl select[data-tr="rwId"],.fl input[data-tr="rw"]{width:150px}.fl input[type=date]{width:145px}
.amais{font-size:12px;padding:6px 10px;white-space:nowrap}
.adet{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px 14px;padding:12px 14px 14px;border-top:1px dashed var(--line);background:#fafbfc;border-radius:0 0 10px 10px}
.adet .w2{grid-column:span 2}.adet label{display:block;font-size:11px;font-weight:700;color:var(--mut);margin-bottom:3px}.adet input,.adet select,.adet textarea{width:100%}
.adel{display:flex;align-items:flex-end;justify-content:flex-end}
.vflow{max-width:860px}.vstep{display:flex;gap:12px}.vrail{display:flex;flex-direction:column;align-items:center;flex:none;width:34px}
.vnum{width:34px;height:34px;border-radius:50%;background:var(--sc);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.vline{flex:1;width:3px;background:#e2e8f0;margin:4px 0;min-height:14px}
.fc.vfc{width:auto;flex:1;min-width:0;border-color:var(--sc);border-left-width:5px;margin-bottom:12px}
.vset{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--sc);border-radius:999px;padding:1px 8px;margin-bottom:5px}
.setleg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 12px;font-size:12px}.setleg span{display:inline-flex;align-items:center;gap:5px}.setleg i{width:10px;height:10px;border-radius:50%;background:var(--sc)}
table.hmt{table-layout:fixed}table.hmt th:first-child,table.hmt td:first-child{width:18%;overflow-wrap:anywhere}
@media(max-width:700px){
 table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:100%!important}table.rt thead,table.rt tr:has(>th){display:none}
 table.rt tr{border-bottom:1px solid var(--line);padding:8px 10px}table.rt td{border:none!important;padding:3px 0!important}
 table.rt td[data-l]::before{content:attr(data-l);display:block;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--mut);letter-spacing:.03em}
 table.rt tr.trg td{padding:6px 0!important}table.rt td.rtn{display:inline-block;width:auto!important;margin-right:6px}
 table.hmt{font-size:11px}table.hmt th,table.hmt td{padding:5px 2px!important}table.hmt th{font-size:9px;line-height:1.1;overflow-wrap:anywhere;vertical-align:bottom}
 .step .sn{font-size:10.5px;overflow-wrap:normal;word-break:normal;hyphens:auto}
 .segbar{padding:10px}.sgv{font-size:17px}.sgo{font-size:11px;padding:5px 9px}}
.ault{color:#64748b}.ahist{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:8px}
.hlg{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;padding:3px 0;border-bottom:1px solid #f1f5f9}.lgw{color:var(--mut);white-space:nowrap}.lgn{font-weight:600}.lgc{overflow-wrap:anywhere}.lgc s,.hlg s{color:#94a3b8}
.lgd{font-size:12px;font-weight:800;color:var(--acc);text-transform:uppercase;margin:14px 0 4px;border-bottom:2px solid var(--acc2);padding-bottom:3px}
.lgi{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid #f1f5f9;font-size:13px}.lgi .lgw{width:44px;flex:none;padding-top:1px}.lgb{min-width:0;flex:1}
.lgt{color:var(--mut);font-size:12px}.lga{color:var(--ink);overflow-wrap:anywhere}.lnk{border:none;background:none;padding:0;color:#0369a1;text-decoration:underline;cursor:pointer;font:inherit;text-align:left}
.mcnt{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px;font-size:12px;font-weight:700}.mcnt span{border-radius:999px;padding:2px 10px}.ms{background:#dcfce7;color:#166534}.mn{background:#fee2e2;color:#991b1b}.mi2{background:#f1f5f9;color:#475569}
.mgr{margin-bottom:10px}.mgt{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--mut);letter-spacing:.04em;margin:6px 0}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:8px}
.mod{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-left:4px solid #cbd5e1;border-radius:10px;padding:7px 8px 7px 10px;background:#fff}
.mod.m-s{border-left-color:#16a34a}.mod.m-n{border-left-color:#dc2626;background:#fef7f7}
.mdn{flex:1;min-width:0;font-size:13px;font-weight:600;line-height:1.25}.mdn small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.mdb{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}.mdb button{border:none;border-radius:0;padding:4px 9px;font-size:12px;font-weight:700;background:#fff;color:var(--mut)}
.mdb button+button{border-left:1px solid var(--line)}.m-s .mdb button.on{background:#16a34a;color:#fff}.m-n .mdb button.on{background:#dc2626;color:#fff}.m-i .mdb button.on{background:#e2e8f0;color:var(--ink)}
.mapt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:18px 0 10px;cursor:pointer;flex-wrap:wrap}
.mapt b{font-size:15px}.mapt .mtc{width:24px;height:24px;border-radius:6px;background:var(--acc2);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:800}.mapt.on{border-color:var(--acc)}
.vazio2{text-align:center;padding:24px;color:var(--ink);border:1px dashed var(--line);border-radius:10px;margin-bottom:12px}
@media(max-width:700px){.adet .w2{grid-column:auto}.actl{width:100%}.fl{flex:1 1 140px}.fl select.ss,.fl select[data-tr="rwId"],.fl input[data-tr="rw"],.fl input[type=date]{width:100%}.amais{flex:1 1 100%}}
.eq{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

.lbrand{font-weight:700;color:var(--acc);font-size:14px;margin-bottom:8px}
.lcard h2{margin:4px 0 14px;font-size:22px}
.lcard label{display:block;font-size:12px;color:var(--mut);font-weight:600;margin:10px 0 4px}
.lcard input{width:100%;padding:10px 12px;font-size:15px}
.lbtn{width:100%;justify-content:center;margin-top:16px;padding:10px;font-size:15px;font-weight:600}
.llinks{display:flex;justify-content:space-between;margin-top:14px;font-size:13px}.llinks a{color:var(--acc)}
.ubox{font-size:12px;color:var(--mut);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#userbox{display:flex;gap:6px;align-items:center}
@media(max-width:900px){
 .drops,.ia-grid,.exp{grid-template-columns:1fr}
 .split{grid-template-columns:1fr}
 .row2{grid-template-columns:1fr}
 main{padding:12px}
 table.ad,table.ad tbody,table.ad tr,table.ad td{display:block;width:100%}
 table.ad thead{display:none}
 table.ad tr{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:6px}
}
@media print{
 body{background:#fff}
 body>*:not(#print){display:none!important}
 #print{display:block;font-size:11pt;color:#000}
 #print h1{font-size:20pt;margin:0 0 6px}
 #print h2{font-size:14pt;color:#0f7c74;margin:18px 0 6px;page-break-after:avoid}
 #print h3{font-size:12pt;margin:12px 0 2px;page-break-after:avoid}
 #print table{border-collapse:collapse;width:100%;font-size:10pt}
 #print th,#print td{border:1px solid #bbb;padding:4px 6px;text-align:left;vertical-align:top}
 #print th{background:#e3f3f1}
 #print .k{color:#555}
 #print .dec{color:#5b4bc4}#print .al{color:#b45309}
}

/* migra trilhas antigas (só clínico) para a trilha completa por área, sem perder o que já foi registrado */
function migraTrilha(p){if(p.trilhaV>=2)return;
 TRILHA.forEach(f=>{const tp=tplItens(f.id),L=p.trilha[f.id]||[],usados=new Set(),out=[];
  const porCod={};tp.forEach(m=>{if(m.cod)porCod[m.cod]=(porCod[m.cod]||0)+1});
  tp.forEach(m=>{let x=L.find(y=>!usados.has(y.id)&&(y.tk===m.tk||(normT(y.cod)===normT(m.cod)&&normT(y.t)===normT(m.t))));
   if(!x&&m.cod&&porCod[m.cod]===1)x=L.find(y=>!usados.has(y.id)&&!y.tk&&y.cod===m.cod);
   if(x){usados.add(x.id);x.tk=m.tk;x.a=m.a;out.push(x)}else out.push(novoItem(m))});
  L.forEach(y=>{if(!usados.has(y.id)){if(!AREA_IDS.includes(y.a))y.a="ger";out.push(y)}});
  p.trilha[f.id]=out});
 p.trilhaV=2}

 for(let i=u.length-22;i>=Math.max(0,u.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}
 if(e<0)throw new Error("zip");
 const n=dv.getUint16(e+10,true);let off=dv.getUint32(e+16,true);const ent={},td=new TextDecoder();
 for(let k=0;k<n;k++){if(dv.getUint32(off,true)!==0x02014b50)break;
  const meth=dv.getUint16(off+10,true),csz=dv.getUint32(off+20,true),nl=dv.getUint16(off+28,true),xl=dv.getUint16(off+30,true),cl=dv.getUint16(off+32,true),lho=dv.getUint32(off+42,true);

  ent[name]={meth,data:u.subarray(st,st+csz)};off+=46+nl+xl+cl}
 return{names:Object.keys(ent),async text(name){const f=ent[name];if(!f)return null;const d=f.meth===0?f.data:await inflateRaw(f.data);return td.decode(d)}};
}
function docxXmlText(x){

async function lerXlsx(buf){
 const z=await unzip(buf);const ss=[];const sx=await z.text("xl/sharedStrings.xml");
 if(sx)for(const m of sx.matchAll(/<si>([\s\S]*?)<\/si>/g))ss.push(dec([...m[1].matchAll(/<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g)].map(x=>x[1]).join("")));
 const wb=await z.text("xl/workbook.xml")||"",rels=await z.text("xl/_rels/workbook.xml.rels")||"";const rmap={};
 for(const m of rels.matchAll(/<Relationship\b[^>]*>/g)){const id=attr(m[0],"Id"),t=attr(m[0],"Target");if(id)rmap[id]=t}
 const sheets=[...wb.matchAll(/<sheet\b[^>]*>/g)].map(m=>({name:dec(attr(m[0],"name")||""),rid:attr(m[0],"r:id"),st:attr(m[0],"state")}));
 const out=[];
 for(const sh of sheets){if(sh.st==="hidden"||sh.st==="veryHidden")continue;let t=(rmap[sh.rid]||"").replace(/^\/?xl\//,"").replace(/^\//,"");const x=await z.text("xl/"+t);if(!x)continue;
  const rows=[];
  for(const r of x.matchAll(/<row\b[^>]*>([\s\S]*?)<\/row>/g)){const cells=[];
   for(const c of r[1].matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){const tp=attr(" "+c[1]+" ","t"),body=c[2]||"";let v="";
    if(tp==="inlineStr")v=dec([...body.matchAll(/<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g)].map(y=>y[1]).join(""));
    else{const mv=body.match(/<v>([\s\S]*?)<\/v>/);if(mv){v=mv[1];v=tp==="s"?(ss[+v]||""):tp==="b"?(v==="1"?"Sim":"Não"):dec(v)}}
    v=String(v).replace(/\s+/g," ").trim();if(v)cells.push(v)}
   if(cells.length)rows.push(cells.join(" | "))}
  if(rows.length)out.push("### Aba: "+sh.name+"\n"+rows.join("\n"))}
 return out.join("\n\n");
}

async function extrairTexto(file){
 const ext=(file.name.split(".").pop()||"").toLowerCase();
 if(["txt","csv","tsv","md","json"].includes(ext))return await file.text();
 const buf=await file.arrayBuffer();
 if(["xlsx","xlsm"].includes(ext))return lerXlsx(buf);
 if(ext==="docx"||ext==="docm")return lerDocx(buf);
 if(ext==="pptx")return lerPptx(buf);
 if(ext==="pdf")return lerPdf(buf);
 if(ext==="xls"||ext==="ods")return lerXlsAntigo(buf);
 throw new Error("formato");
}

 const pend=L.filter(x=>x.st==="PENDENTE CLIENTE").length,atr=L.filter(atrasada).length;
 const c=!tot?"n":ok===tot?"g":pc>=20?"y":"r";return{ok,tot,pc,c,pend,atr,l:{n:"Não se aplica",g:"Concluída",y:"Em andamento",r:"Pendente"}[c]}}

function rHistorico(p){const A=segAtual(p);const tudo=(p.log||[]).slice().reverse();

 <select data-logf="tipo"><option value="">Tudo</option>${Object.entries(TIPOS_LOG).map(([k,v])=>`<option value="${k}" ${logFiltro.tipo===k?"selected":""}>${v}</option>`).join("")}</select>

function rFase(p,f){const A=segAtual(p),ehFase=FASES.includes(f);
 const LA=trL(p,f).filter(x=>!A||x.a===A.id),st=statusFase(p,f,A?A.id:null);
 const filtros=[["todas","Todas",LA.length],["abertas","Em aberto",LA.filter(x=>x.st!=="CONCLUÍDO"&&x.st!=="NÃO APLICAR").length],["pendente","Pendente cliente",LA.filter(x=>x.st==="PENDENTE CLIENTE").length],["atrasadas","Atrasadas",LA.filter(atrasada).length],["concluidas","Concluídas",LA.filter(x=>x.st==="CONCLUÍDO").length]];

    <div class="ahist">${rHistAtiv(p,x.id)}</div></div>`:""}</div>`};

const ehGestor=()=>!!(MEU&&MEU.papel==="gestor");
function pedirNome(){const L=$("login");L.style.display="flex";L.innerHTML=`<div class="lcard"><div class="lbrand">Bem-vindo!</div><h2>Como você quer ser chamado?</h2><p class="hint">Esse nome aparece para a equipe nos projetos e nas atividades.</p><label>Nome</label><input type="text" id="lgNome" value="${esc((USER.email||"").split("@")[0])}"><button class="pri lbtn" data-act="nome-salvar">Salvar</button></div>`;$("lgNome").focus()}
async function salvarNome(n){n=String(n||"").trim();if(!n)return;try{const{error}=await SB.from("perfis").update({nome:n}).eq("id",USER.id);if(error)throw error;if(MEU)MEU.nome=n;const u=pessoaPorId(USER.id);if(u)u.nome=n;toast("Nome salvo")}catch(e){toast("Não foi possível salvar o nome")}}
function telaLogin(modo,msg){loginModo=modo||loginModo;if(msg!==undefined)loginMsg=msg;const L=$("login");L.style.display="flex";
 const card=(corpo)=>`<div class="lcard"><div class="lbrand">Projetos de Implantação · Klingo</div>${loginMsg?`<div class="msg ${loginMsg.err?"err":""}" style="margin:10px 0">${esc(loginMsg.t)}</div>`:""}${corpo}</div>`;
 const btn=(t)=>`<button class="pri lbtn" data-act="login-go" ${loginBusy?"disabled":""}>${loginBusy?'<span class="spin"></span>':""} ${t}</button>`;
 const H={
  carregando:card(`<p class="hint" style="text-align:center;margin:20px 0"><span class="spin" style="color:var(--acc)"></span> Conectando…</p>`),
  semnet:card(`<p>Não foi possível conectar ao serviço de login. Verifique a internet.</p><button class="pri lbtn" data-act="login-retry">Tentar de novo</button>`),
  entrar:card(`<h2>Entrar</h2><label>E-mail</label><input type="email" id="lgEmail" autocomplete="username"><label>Senha</label><input type="password" id="lgSenha" autocomplete="current-password">${btn("Entrar")}
   <div class="llinks"><a href="#" data-act="login-modo" data-arg="criar">Criar conta</a><a href="#" data-act="login-modo" data-arg="esqueci">Esqueci a senha</a></div>`),
  criar:card(`<h2>Criar conta</h2><label>E-mail</label><input type="email" id="lgEmail" autocomplete="username"><label>Senha (mínimo 6 caracteres)</label><input type="password" id="lgSenha" autocomplete="new-password"><label>Confirmar senha</label><input type="password" id="lgSenha2" autocomplete="new-password">${btn("Criar conta")}
   <div class="llinks"><a href="#" data-act="login-modo" data-arg="entrar">Já tenho conta</a></div>`),
  esqueci:card(`<h2>Recuperar senha</h2><p class="hint">Enviaremos um link para você criar uma nova senha.</p><label>E-mail</label><input type="email" id="lgEmail">${btn("Enviar link")}
   <div class="llinks"><a href="#" data-act="login-modo" data-arg="entrar">Voltar</a></div>`),
  novasenha:card(`<h2>Nova senha</h2><label>Nova senha (mínimo 6 caracteres)</label><input type="password" id="lgSenha" autocomplete="new-password">${btn("Salvar nova senha")}`)};
 L.innerHTML=H[loginModo]||H.entrar;const f=L.querySelector("input");if(f)f.focus()}
function esconderLogin(){$("login").style.display="none";loginMsg=null}
const msgErro=e=>{const m=String((e&&e.message)||e||"");if(/Invalid login/i.test(m))return"E-mail ou senha incorretos.";if(/Email not confirmed/i.test(m))return"Confirme seu e-mail pelo link que enviamos antes de entrar.";if(/already registered/i.test(m))return"Este e-mail já tem conta. Use \"Já tenho conta\".";if(/Password should be/i.test(m))return"A senha precisa ter pelo menos 6 caracteres.";if(/fetch|network/i.test(m))return"Sem conexão com a internet.";return m||"Não foi possível concluir."};
async function acaoLogin(){if(loginBusy)return;const em=($("lgEmail")||{}).value,se=($("lgSenha")||{}).value,se2=($("lgSenha2")||{}).value;
 const m=loginModo;loginBusy=true;loginMsg=null;telaLogin();if($("lgEmail"))$("lgEmail").value=em||"";
 try{
  if(m==="entrar"){const{data,error}=await SB.auth.signInWithPassword({email:em,password:se});if(error)throw error;loginBusy=false;await entrou(data.user);return}
  if(m==="criar"){if(se!==se2)throw new Error("As senhas não conferem.");const{data,error}=await SB.auth.signUp({email:em,password:se,options:{emailRedirectTo:location.href.split("#")[0]}});if(error)throw error;
   loginBusy=false;if(data.session){await entrou(data.user);return}telaLogin("entrar",{t:"Conta criada! Abra o e-mail que enviamos e clique no link de confirmação. Depois é só entrar aqui."});return}
  if(m==="esqueci"){const{error}=await SB.auth.resetPasswordForEmail(em,{redirectTo:location.href.split("#")[0]});if(error)throw error;loginBusy=false;telaLogin("entrar",{t:"Se o e-mail tiver conta, você vai receber um link para criar uma nova senha."});return}
  if(m==="novasenha"){const{data,error}=await SB.auth.updateUser({password:se});if(error)throw error;loginBusy=false;toast("Senha alterada");await entrou(data.user);return}
 }catch(e){loginBusy=false;telaLogin(m,{err:true,t:msgErro(e)});if($("lgEmail"))$("lgEmail").value=em||""}}
async function iniciarNuvem(){
 if(!nuvemAtiva()){render();return}
 telaLogin("carregando");
 try{await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js")}catch(e){telaLogin("semnet");return}
 SB=window.supabase.createClient(nuvemURL(),nuvemKEY());
 SB.auth.onAuthStateChange((ev,ses)=>{if(ev==="PASSWORD_RECOVERY")telaLogin("novasenha",null)});
 if(/type=recovery/.test(location.hash))return;
 try{const{data}=await SB.auth.getSession();if(data&&data.session)await entrou(data.session.user);else telaLogin("entrar")}catch(e){telaLogin("semnet")}}
async function entrou(user){
 USER=user;let cache=null;try{cache=JSON.parse(localStorage.getItem(chaveLocal()))}catch(e){}
 sync.dirty=new Set((cache&&cache.pend)||[]);sync.del=new Set((cache&&cache.del)||[]);
 let remotos=[];
 try{const{data,error}=await SB.from("projetos").select("id,owner,membros,dados,atualizado");if(error)throw error;remotos=(data||[]).map(r=>{const d=normaliza(r.dados);d.owner=r.owner;d.membros=r.membros||[];return d});sync.err=false;await carregarEquipe()}
 catch(e){sync.err=true;remotos=null}
 let lista;
 if(remotos===null)lista=(cache&&cache.projetos)||[];
 else{lista=remotos.filter(r=>!sync.del.has(r.id));((cache&&cache.projetos)||[]).forEach(l=>{if(sync.dirty.has(l.id)){const i=lista.findIndex(r=>r.id===l.id);if(i>=0)lista[i]=l;else lista.push(l)}})}
 lista.forEach(normaliza);
 const cur=cache&&cache.cur;
 S={cur:lista.some(x=>x.id===cur)?cur:(lista[0]||{}).id,projetos:lista};
 esconderLogin();
 // projetos que estavam só neste computador (antes do login)
 let legado=null;try{legado=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 const locais=legado&&Array.isArray(legado.projetos)?legado.projetos.filter(x=>temConteudoProj(x)&&!lista.some(y=>y.id===x.id)):[];
 lista.forEach(x=>{if(!x.owner)x.owner=USER.id;if(!x.membros)x.membros=[]});
 if(!lista.length){const n=novoProjeto("Meu primeiro projeto");S.projetos.push(n);S.cur=n.id;if(!locais.length)marcar(n.id)}
 tab="painel";sel=null;persist();render();if(sync.dirty.size||sync.del.size)enviarNuvem();
 if(locais.length&&!localStorage.getItem("ppi_migrado_"+USER.id))mostrarMigracao(locais);else if(MEU&&!MEU.nome)pedirNome()}
function temConteudoProj(p){try{normaliza(p);return !!(p.info.cliente||Object.values(p.docs).some(Boolean)||p.aderencia.length||p.etapas.some(e=>Object.keys(e.r).length)||TRILHA.some(f=>(p.trilha[f.id]||[]).some(x=>x.st!=="A REALIZAR")))}catch(e){return false}}
function mostrarMigracao(locais){const L=$("login");L.style.display="flex";
 L.innerHTML=`<div class="lcard"><div class="lbrand">Projetos deste computador</div><h2>Levar para a sua conta?</h2><p>Encontrei ${locais.length} projeto(s) salvo(s) neste computador antes do login:</p><ul>${locais.map(x=>`<li><b>${esc(x.nome)}</b></li>`).join("")}</ul>
 <button class="pri lbtn" data-act="mig-sim">Enviar para a nuvem</button><button class="lbtn" data-act="mig-nao" style="margin-top:6px">Agora não</button></div>`;
 mostrarMigracao.lista=locais}
async function enviarNuvem(){
 if(!USER||!SB||sync.busy)return;clearTimeout(sync.timer);clearTimeout(sync.retry);sync.busy=true;setSt();let falhou=false;
 for(const id of [...sync.del]){try{const{error}=await SB.from("projetos").delete().eq("id",id);if(error)throw error;sync.del.delete(id)}catch(e){falhou=true}}
 for(const id of [...sync.dirty]){const p=S.projetos.find(x=>x.id===id);if(!p){sync.dirty.delete(id);continue}
  const upd=p.upd;try{const{error}=await SB.from("projetos").upsert({id:p.id,owner:p.owner||USER.id,membros:p.membros||[],nome:p.nome,dados:p,atualizado:new Date().toISOString()});if(error)throw error;if(p.upd===upd)sync.dirty.delete(id)}catch(e){falhou=true}}
 sync.busy=false;sync.err=falhou;persist();
 if(falhou)sync.retry=setTimeout(enviarNuvem,20000);else if(sync.dirty.size)sync.timer=setTimeout(enviarNuvem,1200);setSt()}
async function atualizarDaNuvem(){if(!USER||!SB||sync.busy||sync.dirty.size||sync.del.size)return;
 try{const{data,error}=await SB.from("projetos").select("id,owner,membros,dados");if(error)throw error;let mudou=false;await carregarEquipe();
  (data||[]).forEach(r=>{const d=normaliza(r.dados);d.owner=r.owner;d.membros=r.membros||[];const i=S.projetos.findIndex(x=>x.id===d.id);if(i<0){S.projetos.push(d);mudou=true}else if((d.upd||0)>(S.projetos[i].upd||0)){S.projetos[i]=d;mudou=true}});
  const ids=new Set((data||[]).map(r=>r.id));const antes=S.projetos.length;S.projetos=S.projetos.filter(x=>ids.has(x.id));if(S.projetos.length!==antes)mudou=true;
  if(!S.projetos.length){const n=novoProjeto();S.projetos.push(n);marcar(n.id)}if(!S.projetos.some(x=>x.id===S.cur))S.cur=S.projetos[0].id;
  if(mudou){persist();const a=document.activeElement;if(!(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")))render()}}catch(e){}}
window.addEventListener("online",()=>{sync.err=false;enviarNuvem()});
window.addEventListener("focus",()=>atualizarDaNuvem());
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")atualizarDaNuvem()});
document.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&$("login").style.display==="flex"&&ev.target.closest&&ev.target.closest("#login")){ev.preventDefault();acaoLogin()}});
async function sair(){try{if(sync.dirty.size||sync.del.size)await enviarNuvem()}catch(e){}if(sync.dirty.size&&!confirmSair){confirmSair=true;toast("Há alterações ainda não enviadas. Clique em Sair de novo para sair mesmo assim.",4000);return}
 confirmSair=false;try{await SB.auth.signOut()}catch(e){}USER=null;EQUIPE=[];MEU=null;tab="painel";projSel=false;sync.dirty.clear();sync.del.clear();S={cur:null,projetos:[novoProjeto()]};S.cur=S.projetos[0].id;$("app").innerHTML="";telaLogin("entrar",null)}
let confirmSair=false;
iniciarNuvem();
</script>
</body>
</html>
